<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#03070B; --ink:#DDF6FF; --muted:#6F8FA0; --line:#0F2A38;
  --cyan:#2BD9FF; --cyan-2:#0FA3C9; --amber:#FFB547; --violet:#9D8CFF; --red:#FF5C6C;
  --display:"Rajdhani","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 42%,#062030 0%,var(--bg) 62%);color:var(--ink);font:15px/1.5 var(--body);overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(43,217,255,.025) 0 1px,transparent 1px 3px)}
canvas#orb{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
.hud{position:fixed;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tl{top:18px;left:20px}.tr{top:18px;right:20px;text-align:right}.bl{bottom:18px;left:20px}
.brand{font:700 22px var(--display);letter-spacing:.3em;color:var(--cyan);text-shadow:0 0 18px rgba(43,217,255,.6)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:8px;vertical-align:1px}
.dot.ok{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.dot.bad{background:var(--red);box-shadow:0 0 10px var(--red)}
#state{position:fixed;left:50%;top:calc(50% + min(24vh,210px));transform:translateX(-50%);font:600 13px var(--display);letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;text-shadow:0 0 12px rgba(43,217,255,.5);white-space:nowrap}
#live{position:fixed;left:50%;top:calc(50% + min(24vh,210px) + 26px);transform:translateX(-50%);width:min(680px,90vw);text-align:center;color:var(--muted);min-height:22px;font-size:15px}
#tools{position:fixed;left:50%;top:calc(50% - min(24vh,210px) - 44px);transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:90vw}
.chip{font:500 11px var(--mono);letter-spacing:.1em;padding:4px 10px;border:1px solid var(--amber);color:var(--amber);border-radius:2px;background:rgba(255,181,71,.06);animation:fade 3s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
#log{position:fixed;right:20px;top:60px;bottom:90px;width:min(380px,32vw);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px;mask-image:linear-gradient(transparent,#000 8%)}
#log::-webkit-scrollbar{width:0}
.msg{border-left:2px solid var(--line);padding:2px 0 2px 12px;white-space:pre-wrap;word-wrap:break-word}
.msg .who{font:500 10px var(--mono);letter-spacing:.2em;color:var(--muted);display:block;margin-bottom:2px}
.msg.cee{border-color:var(--cyan)}.msg.cee .who{color:var(--cyan)}
.msg.err{border-color:var(--red);color:#ffc1c7}
#bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;width:min(640px,calc(100vw - 32px))}
#text{flex:1;background:rgba(6,24,34,.8);border:1px solid var(--line);color:var(--ink);font:15px var(--body);padding:11px 14px;border-radius:3px;outline:none}
#text:focus{border-color:var(--cyan-2);box-shadow:0 0 0 1px var(--cyan-2)}
button{font:600 12px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);background:rgba(6,24,34,.8);border:1px solid var(--line);padding:0 14px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--cyan-2)}button.on{background:var(--cyan);color:#001018;border-color:var(--cyan)}
#help{position:fixed;left:20px;bottom:74px;font:400 11px var(--mono);color:var(--muted);line-height:1.8;letter-spacing:.06em}
kbd{border:1px solid var(--line);padding:0 5px;border-radius:2px;color:var(--ink)}
@media (max-width:900px){#log{display:none}#help{display:none}}
</style>
</head>
<body>
<canvas id="orb" title="Click to talk"></canvas>

<div class="hud tl"><div class="brand">C E E</div><div id="conn"><span class="dot"></span>connecting</div></div>
<div class="hud tr"><div id="clock">--:--:--</div><div id="date"></div></div>
<div id="tools"></div>
<div id="state">standby</div>
<div id="live"></div>
<div id="log"></div>
<div id="help">
  <kbd>click orb</kbd> / <kbd>space</kbd> talk · <kbd>esc</kbd> stop<br>
  say “<b>CEE …</b>” when wake is on
</div>
<div id="bar">
  <button id="lang" title="Language you speak (EN / TH)">EN</button>
  <input id="text" placeholder="Type to CEE…" autocomplete="off">
  <button id="screen" title="Let CEE see your screen">Screen</button>
  <button id="wake" title="Always listen for “CEE”">Wake</button>
  <button id="mute" title="Voice replies on/off">Voice</button>
</div>

<script src="config.js"></script>
<script>
(() => {
const CFG = window.CEE || {};
const BASE = (CFG.url || "http://127.0.0.1:8642/p/cee/v1").replace(/\/$/, "");
const KEY = CFG.key || "";
const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem("cee."+k);return v===null?d:JSON.parse(v)}catch{return d}},
               set(k,v){try{localStorage.setItem("cee."+k,JSON.stringify(v))}catch{}}};

let state = "idle";          // idle | listening | thinking | speaking
let lang = store.get("speechLang","en-US");
let voiceOn = store.get("voice",true);
let wakeOn = store.get("wake",false);
let level = 0, target = 0;   // orb energy 0..1
let abortCtl = null;

// ---------- UI helpers ----------
const labels = {idle:"standby", listening:"listening", thinking:"thinking", speaking:"speaking"};
let thinkStart = 0;
function setState(s){ state = s; if(s==="thinking") thinkStart = performance.now();
  $("#state").textContent = labels[s] + (s==="idle" && wakeOn ? " · say CEE" : ""); }
setInterval(()=>{ if(state==="thinking") $("#state").textContent = "thinking · " + Math.round((performance.now()-thinkStart)/1000) + "s"; }, 250);
function live(t){ $("#live").textContent = t || ""; }
function addMsg(who, text, cls){
  const d = document.createElement("div"); d.className = "msg " + (cls||"");
  d.innerHTML = `<span class="who">${who}</span>`; const t = document.createElement("span"); t.textContent = text; d.appendChild(t);
  $("#log").appendChild(d); $("#log").scrollTop = 1e9; return t;
}
function chip(t){ const c = document.createElement("span"); c.className="chip"; c.textContent = t; $("#tools").appendChild(c); setTimeout(()=>c.remove(),3200); }
function refreshButtons(){
  $("#lang").textContent = lang.startsWith("th") ? "TH" : "EN";
  $("#mute").classList.toggle("on", voiceOn); $("#wake").classList.toggle("on", wakeOn);
  $("#screen").classList.toggle("on", !!screenStream); setState(state);
}
setInterval(()=>{ const d=new Date(); $("#clock").textContent=d.toLocaleTimeString("en-GB");
  $("#date").textContent=d.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}); },1000);

// ---------- connection check ----------
async function ping(){
  const el = $("#conn");
  if(!KEY){ el.innerHTML='<span class="dot bad"></span>no key — run setup-orb'; return; }
  try{
    const r = await fetch(BASE + "/models", {headers:{Authorization:"Bearer "+KEY}});
    el.innerHTML = r.ok ? '<span class="dot ok"></span>online' : `<span class="dot bad"></span>error ${r.status}`;
  }catch{ el.innerHTML='<span class="dot bad"></span>offline — is CEE running?'; }
}
ping(); setInterval(ping, 30000);

// ---------- audio: mic level + chime ----------
let actx, analyser, micData;
async function ensureMic(){
  if(analyser) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    analyser = actx.createAnalyser(); analyser.fftSize = 512;
    actx.createMediaStreamSource(stream).connect(analyser);
    micData = new Uint8Array(analyser.fftSize);
  }catch(e){ console.warn("mic", e); }
}
function micLevel(){
  if(!analyser) return 0; analyser.getByteTimeDomainData(micData);
  let s=0; for(const v of micData){ const x=(v-128)/128; s+=x*x; } return Math.min(1, Math.sqrt(s/micData.length)*4);
}
function chime(up=true){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.type="sine";
    const t=actx.currentTime; o.frequency.setValueAtTime(up?660:880,t); o.frequency.exponentialRampToValueAtTime(up?1320:440,t+.12);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.25);
  }catch{}
}

// ---------- speech out ----------
const synth = window.speechSynthesis; let voices = [];
function loadVoices(){ voices = synth ? synth.getVoices() : []; }
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
const isThai = t => /[฀-๿]/.test(t);
function pickVoice(text){
  const want = isThai(text) ? "th" : "en";
  const pool = voices.filter(v => v.lang.toLowerCase().startsWith(want));
  const score = v => (/natural|online|neural/i.test(v.name)?4:0) + (/google/i.test(v.name)?2:0) +
                     (/ava|andrew|emma|brian|niwat|premwadee/i.test(v.name)?3:0) + (/multilingual/i.test(v.name)?1:0);
  return pool.sort((a,b)=>score(b)-score(a))[0] || null;
}
const speakQ = []; let speaking = false, speakPulse = 0;
function cleanForSpeech(t){
  return t.replace(/```[\s\S]*?```/g," (code) ").replace(/`([^`]*)`/g,"$1").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1")
          .replace(/https?:\/\/\S+/g,"link").replace(/[*_#>|~]/g,"").replace(/^\s*[-•]\s+/gm,"").replace(/\s+/g," ").trim();
}
function speak(text){
  if(!voiceOn || !synth) return; text = cleanForSpeech(text); if(!text) return;
  speakQ.push(text); if(!speaking) nextSpeak();
}
function nextSpeak(){
  const t = speakQ.shift();
  if(!t){ speaking=false; if(state==="speaking"){ setState("idle"); live(""); resumeWake(); } return; }
  speaking = true; setState("speaking"); pauseWake();
  const u = new SpeechSynthesisUtterance(t); const v = pickVoice(t);
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang = isThai(t) ? "th-TH" : "en-US";
  u.rate = 1.0; u.onboundary = () => { speakPulse = 1; };
  u.onend = u.onerror = () => nextSpeak();
  synth.speak(u);
}
function stopAll(){
  if(abortCtl){ abortCtl.abort(); abortCtl=null; }
  speakQ.length=0; if(synth) synth.cancel(); speaking=false;
  if(rec && recActive) try{ rec.abort(); }catch{}
  setState("idle"); live(""); resumeWake();
}
// split streamed text into speakable chunks
let pending = "";
function feedSpeech(delta, final=false){
  pending += delta;
  for(;;){
    const m = pending.match(/^[\s\S]*?([.!?…。]|\n|ครับ|ค่ะ|นะ)(\s|$)/);
    if(m && m[0].trim().length > 1){ speak(m[0]); pending = pending.slice(m[0].length); continue; }
    if(pending.length > 220){ const cut = pending.lastIndexOf(" ",200); const i = cut>60?cut:200; speak(pending.slice(0,i)); pending = pending.slice(i); continue; }
    break;
  }
  if(final && pending.trim()){ speak(pending); pending = ""; }
}

// ---------- brain: CEE via Hermes API ----------
const VOICE_STYLE = "You are in a live spoken conversation through the CEE orb; your reply is read aloud. " +
  "Talk like a real person: warm, relaxed, contractions, a quick natural reaction first. " +
  "Keep it to one to three short sentences unless asked for detail. No markdown, lists, emojis or URLs. " +
  "If a screenshot of the user's screen is attached, use it to answer about what they're looking at.";

// Screen sharing: when on, every question carries a fresh snapshot of the screen.
let screenStream = null, screenVideo = null;
async function toggleScreen(){
  if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; refreshButtons(); return; }
  try{
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:2 }, audio:false });
    screenVideo = document.createElement("video"); screenVideo.muted = true; screenVideo.srcObject = screenStream; await screenVideo.play();
    screenStream.getVideoTracks()[0].addEventListener("ended", () => { screenStream=null; refreshButtons(); });
    live("CEE can see your screen now. Ask about it.");
  }catch{ screenStream = null; }
  refreshButtons();
}
function grabScreen(){
  if(!screenStream || !screenVideo || !screenVideo.videoWidth) return null;
  const w = Math.min(1280, screenVideo.videoWidth), h = Math.round(screenVideo.videoHeight * w / screenVideo.videoWidth);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(screenVideo, 0, 0, w, h); return c.toDataURL("image/jpeg", 0.7);
}
async function buildInput(text){
  const shot = grabScreen(); if(!shot) return text;
  chip("👁 looking at your screen");
  return [{ role:"user", content:[ { type:"input_text", text }, { type:"input_image", image_url: shot } ] }];
}
async function ask(text){
  text = text.trim(); if(!text) return;
  stopAll(); addMsg("you", text); live(""); setState("thinking");
  const out = addMsg("cee", "", "cee"); let full = "";
  abortCtl = new AbortController();
  try{
    const r = await fetch(BASE + "/responses", {
      method:"POST", signal:abortCtl.signal,
      headers:{ "Authorization":"Bearer "+KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ model:"cee", input: await buildInput(text), conversation:"cee-orb", stream:true,
                            instructions: VOICE_STYLE,
                            model_options:{ reasoning_effort:"low" } })  // voice: fast answers
    });
    if(!r.ok) throw new Error(`CEE error ${r.status}: ${(await r.text()).slice(0,200)}`);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", ev = "";
    for(;;){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i; while((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0,i).replace(/\r$/,""); buf = buf.slice(i+1);
        if(!line){ ev=""; continue; } if(line.startsWith(":")) continue;
        if(line.startsWith("event:")){ ev = line.slice(6).trim(); continue; }
        if(!line.startsWith("data:")) continue;
        const raw = line.slice(5).trim(); if(raw === "[DONE]") continue;
        let d; try{ d = JSON.parse(raw); }catch{ continue; }
        const type = d.type || ev;
        if(type === "response.output_text.delta" && d.delta){
          full += d.delta; out.textContent = full; $("#log").scrollTop = 1e9;
          live(full.slice(-140)); feedSpeech(d.delta);
          if(state === "thinking" && !voiceOn) setState("speaking");
        } else if(type === "response.output_item.added" && d.item && d.item.type === "function_call"){
          chip("⚙ " + (d.item.name || "tool").replace(/_/g," "));
        } else if(type === "response.failed" || type === "error"){
          throw new Error((d.response && d.response.error && d.response.error.message) || d.message || "CEE failed");
        }
      }
    }
    feedSpeech("", true);
    if(!full){ out.textContent = "(no reply)"; }
    if(!voiceOn || !synth){ setState("idle"); live(""); resumeWake(); }
    else if(!speaking && !speakQ.length){ setState("idle"); resumeWake(); }
  }catch(e){
    if(e.name === "AbortError") return;
    out.parentElement.classList.add("err"); out.textContent = String(e.message || e);
    setState("idle"); live(""); resumeWake();
  }finally{ abortCtl = null; }
}

// ---------- speech in ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recActive = false, recMode = null, wakeArmed = false;
const WAKE = /^\s*(?:hey|hi|ok|okay|เฮ้|เฮ|ฮัลโหล)?\s*(?:cee|see|sea|si|c|ซีอี|ซีย์|ซี)(?:[\s,.!?]+|$)/i;
function micHelp(err){
  if(err === "network" || err === "service-not-allowed") return "Voice input doesn't work in this browser — open CEE in Microsoft Edge (desktop icon).";
  if(err === "not-allowed") return "Microphone is blocked — click the 🔒 next to the address, allow Microphone, then reload.";
  if(err === "no-speech") return "Didn't hear anything — click the orb and speak.";
  if(err === "audio-capture") return "No microphone found — check it's plugged in.";
  return err === "aborted" ? "" : "mic: " + err;
}
function makeRec(continuous){
  const r = new SR(); r.lang = lang; r.interimResults = true; r.continuous = continuous; r.maxAlternatives = 1; return r;
}
async function listenOnce(){
  if(!SR){ live("Voice input needs Chrome or Edge — type below."); return; }
  stopAll(); await ensureMic(); pauseWake(true);
  rec = makeRec(false); recMode = "once"; let finalText = "";
  rec.onstart = () => { recActive = true; setState("listening"); chime(true); };
  rec.onresult = e => { let t=""; for(const res of e.results){ t += res[0].transcript; if(res.isFinal) finalText = t; } live(t); };
  let errMsg = "";
  rec.onerror = e => { errMsg = micHelp(e.error); live(errMsg); };
  rec.onend = () => { recActive = false; recMode = null; if(finalText) ask(finalText); else { setState("idle"); live(errMsg); resumeWake(); } };
  try{ rec.start(); }catch{}
}
function startWake(){
  if(!SR || !wakeOn || recActive || state !== "idle") return;
  rec = makeRec(true); recMode = "wake";
  rec.onstart = () => { recActive = true; setState("idle"); };
  rec.onresult = e => {
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res = e.results[i]; const t = res[0].transcript;
      if(wakeArmed){ live(t); if(res.isFinal){ wakeArmed=false; rec.abort(); ask(t); } continue; }
      const m = t.match(WAKE);
      if(m){ const rest = t.slice(m[0].length);
        if(res.isFinal){ if(rest.trim()){ rec.abort(); ask(rest); } else { wakeArmed = true; chime(true); setState("listening"); } }
        else live(rest);
      }
    }
  };
  let fatal = false;
  rec.onerror = e => { if(["network","not-allowed","service-not-allowed","audio-capture"].includes(e.error)){ fatal = true; live(micHelp(e.error)); } };
  rec.onend = () => { recActive = false; recMode = null; if(!fatal && wakeOn && state==="idle") setTimeout(startWake, 300); };
  try{ rec.start(); }catch{}
}
function pauseWake(){ if(rec && recActive && recMode==="wake") try{ rec.abort(); }catch{} }
function resumeWake(){ if(wakeOn) setTimeout(startWake, 400); }

// ---------- controls ----------
$("#orb").addEventListener("click", () => { if(state==="listening" && recMode==="once") rec.stop(); else if(state==="speaking"||state==="thinking") stopAll(); else listenOnce(); });
$("#text").addEventListener("keydown", e => { if(e.key==="Enter"){ ask(e.target.value); e.target.value=""; } });
$("#lang").onclick = () => { lang = lang.startsWith("th") ? "en-US" : "th-TH"; store.set("speechLang",lang); refreshButtons(); if(recMode==="wake"){ pauseWake(); resumeWake(); } };
$("#screen").onclick = () => toggleScreen();
$("#mute").onclick = () => { voiceOn = !voiceOn; store.set("voice",voiceOn); if(!voiceOn && synth) synth.cancel(); refreshButtons(); };
$("#wake").onclick = async () => { wakeOn = !wakeOn; store.set("wake",wakeOn); refreshButtons(); if(wakeOn){ await ensureMic(); startWake(); } else pauseWake(); };
document.addEventListener("keydown", e => {
  if(e.target.id === "text") { if(e.key==="Escape") stopAll(); return; }
  if(e.code === "Space"){ e.preventDefault(); $("#orb").click(); }
  if(e.key === "Escape") stopAll();
});
if(!SR){ $("#wake").style.display="none"; }
refreshButtons(); if(wakeOn) ensureMic().then(startWake);

// ---------- the orb ----------
const cv = $("#orb"), cx = cv.getContext("2d"); let W,H,DPR;
function resize(){ DPR = Math.min(2, devicePixelRatio||1); W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR; }
addEventListener("resize", resize); resize();
const palette = { idle:[43,217,255], listening:[43,217,255], thinking:[157,140,255], speaking:[43,217,255] };
let col = [43,217,255], rot = 0, t0 = performance.now();
const N = 120; const bars = new Float32Array(N);
function frame(now){
  const t = (now - t0)/1000;
  // energy target by state
  if(state==="listening") target = Math.max(.15, micLevel());
  else if(state==="speaking"){ speakPulse *= .9; target = .35 + .45*speakPulse + .15*Math.abs(Math.sin(t*7.3))*Math.abs(Math.sin(t*3.1)); }
  else if(state==="thinking") target = .3 + .1*Math.sin(t*4);
  else target = .08 + .05*Math.sin(t*1.4);
  level += (target - level) * .18;
  const want = palette[state]; col = col.map((c,i)=>c + (want[i]-c)*.06);
  const [r,g,b] = col.map(Math.round), C = a => `rgba(${r},${g},${b},${a})`;

  cx.clearRect(0,0,W,H);
  const X = W/2, Y = H/2, R = Math.min(W,H)*.2;
  rot += (state==="thinking" ? .035 : .006);

  // outer glow
  const glow = cx.createRadialGradient(X,Y,R*.2,X,Y,R*2.2);
  glow.addColorStop(0,C(.18+level*.25)); glow.addColorStop(1,C(0));
  cx.fillStyle = glow; cx.fillRect(0,0,W,H);

  // radial bars
  for(let i=0;i<N;i++){
    const n = Math.sin(i*1.7 + t*3) * Math.sin(i*.37 - t*2.1) * .5 + .5;
    const v = level * (.35 + .65*n);
    bars[i] += (v - bars[i]) * .25;
    const a = i/N*Math.PI*2 + rot*.5, r1 = R*1.18, r2 = r1 + R*.06 + bars[i]*R*.55;
    cx.strokeStyle = C(.25 + bars[i]*.7); cx.lineWidth = 2*DPR;
    cx.beginPath(); cx.moveTo(X+Math.cos(a)*r1, Y+Math.sin(a)*r1); cx.lineTo(X+Math.cos(a)*r2, Y+Math.sin(a)*r2); cx.stroke();
  }
  // HUD rings
  cx.lineWidth = 1.2*DPR;
  cx.strokeStyle = C(.35); cx.setLineDash([2*DPR, 9*DPR]);
  cx.beginPath(); cx.arc(X,Y,R*1.08,0,Math.PI*2); cx.stroke(); cx.setLineDash([]);
  for(let k=0;k<3;k++){
    const s = rot*(k%2?-1.6:1.1) + k*2.1, len = .7 + k*.25;
    cx.strokeStyle = C(.55 - k*.12); cx.lineWidth = (2.2-k*.5)*DPR;
    cx.beginPath(); cx.arc(X,Y,R*(1.55+k*.14),s,s+len); cx.stroke();
    cx.beginPath(); cx.arc(X,Y,R*(1.55+k*.14),s+Math.PI,s+Math.PI+len*.5); cx.stroke();
  }
  // ticks
  cx.strokeStyle = C(.3); cx.lineWidth = 1*DPR;
  for(let i=0;i<60;i++){ const a=i/60*Math.PI*2 - rot*.3, r1=R*1.95, r2=r1+(i%5?R*.03:R*.08);
    cx.beginPath(); cx.moveTo(X+Math.cos(a)*r1,Y+Math.sin(a)*r1); cx.lineTo(X+Math.cos(a)*r2,Y+Math.sin(a)*r2); cx.stroke(); }

  // core
  const cr = R*(.72 + level*.22);
  const core = cx.createRadialGradient(X - cr*.25, Y - cr*.3, cr*.05, X, Y, cr);
  core.addColorStop(0,"rgba(235,252,255,.95)"); core.addColorStop(.25,C(.85)); core.addColorStop(.75,C(.25)); core.addColorStop(1,C(0));
  cx.fillStyle = core; cx.beginPath(); cx.arc(X,Y,cr,0,Math.PI*2); cx.fill();
  cx.strokeStyle = C(.8); cx.lineWidth = 1.5*DPR; cx.beginPath(); cx.arc(X,Y,R*.98,0,Math.PI*2); cx.stroke();

  // name
  cx.fillStyle = "rgba(3,12,18,.85)"; cx.font = `700 ${Math.round(R*.34)}px Rajdhani, sans-serif`;
  cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("CEE", X, Y + R*.02);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
