name: cee
version: 0.1.0
description: "CEE — Chain's personal AI agent. Thai + English, Telegram, voice notes, Gmail/Calendar/Drive, web, content skills. Brain: NVIDIA Build (free), Gemini backup."
author: "Chain"
license: "MIT"

env_requires:
  - name: NVIDIA_API_KEY
    description: "NVIDIA Build key — CEE's brain (free): https://build.nvidia.com"
    required: true
  - name: GEMINI_API_KEY
    description: "Google AI Studio key — backup brain (free): https://aistudio.google.com/apikey"
    required: false
    default: ""
  - name: TELEGRAM_BOT_TOKEN
    description: "Bot token from @BotFather"
    required: true
  - name: TELEGRAM_ALLOWED_USERS
    description: "Your numeric Telegram user ID from @userinfobot (only you can talk to CEE)"
    required: true
  - name: TELEGRAM_HOME_CHANNEL
    description: "Where scheduled messages go — usually the same as your user ID"
    required: false
    default: ""
  - name: OPENROUTER_API_KEY
    description: "Optional backup brain (free ':free' models) when Gemini's free quota runs out: https://openrouter.ai/keys"
    required: false
    default: ""
  - name: OBSIDIAN_VAULT_PATH
    description: "Folder of the Obsidian vault CEE uses as long-term memory (installer creates Documents/CEE Brain)"
    required: false
    default: ""
